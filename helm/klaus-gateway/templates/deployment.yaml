apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "resource.default.name" . }}
  namespace: {{ include "resource.default.namespace" . }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if and .Values.obo.enabled .Values.obo.storePath .Values.obo.persistence.enabled }}
  # A single ReadWriteOnce link-store PVC cannot be mounted by two pods at once,
  # so a rolling update would deadlock (new pod pending on a volume the old pod
  # still holds). Recreate releases the volume before the replacement starts.
  strategy:
    type: Recreate
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "labels.selector" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: klaus-gateway
      labels:
        {{- include "labels.selector" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "resource.default.name" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.pod.user.id }}
        runAsGroup: {{ .Values.pod.group.id }}
        {{- if and .Values.obo.enabled .Values.obo.storePath .Values.obo.persistence.enabled }}
        # Make the link-store PVC group-owned and group-writable by the non-root
        # runtime user so the encrypted bolt file can be created.
        fsGroup: {{ .Values.pod.group.id }}
        {{- end }}
        {{- with .Values.podSecurityContext }}
          {{- . | toYaml | nindent 8 }}
        {{- end }}
      containers:
      - name: klaus-gateway
        image: "{{ .Values.image.registry }}/{{ .Values.image.name }}:{{ include "image.tag" . }}"
        imagePullPolicy: "{{ .Values.image.pullPolicy }}"
        args:
        - --listen-address=:{{ .Values.server.port }}
        - --admin-address=:{{ .Values.admin.port }}
        - --log-level={{ .Values.logLevel }}
        - --store={{ .Values.routing.store }}
        {{- if eq .Values.routing.store "bolt" }}
        - --bolt-path={{ .Values.routing.boltPath }}
        {{- end }}
        {{- if or (eq .Values.routing.store "configmap") (eq .Values.routing.store "crd") }}
        - --namespace=$(POD_NAMESPACE)
        {{- end }}
        {{- if .Values.controller.enabled }}
        - --controller=true
        {{- end }}
        {{- if .Values.routing.defaultTTL }}
        - --default-ttl={{ .Values.routing.defaultTTL }}
        {{- end }}
        {{- if or .Values.routing.autoCreate .Values.a2a.enabled }}
        - --auto-create
        {{- end }}
        - --driver={{ .Values.lifecycle.driver }}
        {{- if and (eq .Values.lifecycle.driver "klausctl") .Values.lifecycle.klausctlBin }}
        - --klausctl-bin={{ .Values.lifecycle.klausctlBin }}
        {{- end }}
        {{- if eq .Values.lifecycle.driver "operator" }}
        {{- if .Values.lifecycle.operatorMCPURL }}
        - --operator-mcp-url={{ .Values.lifecycle.operatorMCPURL }}
        {{- end }}
        {{- if .Values.lifecycle.operatorMCPToken }}
        - --operator-mcp-token={{ .Values.lifecycle.operatorMCPToken }}
        {{- end }}
        {{- end }}
        {{- if and (eq .Values.lifecycle.driver "static") .Values.lifecycle.staticInstances }}
        - --static-instances={{ .Values.lifecycle.staticInstances }}
        {{- end }}
        {{- if .Values.upstream.url }}
        - --agentgateway-url={{ .Values.upstream.url }}
        {{- end }}
        {{- if .Values.observability.otlpEndpoint }}
        - --otel-otlp-endpoint={{ .Values.observability.otlpEndpoint }}
        {{- end }}
        {{- if .Values.slack.enabled }}
        - --slack-enabled
        - --slack-mode={{ .Values.slack.mode }}
        {{- end }}
        {{- if .Values.a2a.enabled }}
        - --a2a-enabled
        {{- if .Values.a2a.defaultAgent }}
        - --a2a-default-agent={{ .Values.a2a.defaultAgent }}
        {{- end }}
        {{- if .Values.a2a.url }}
        - --a2a-url={{ .Values.a2a.url }}
        {{- end }}
        {{- if .Values.a2a.saToken.enabled }}
        - --a2a-token-path={{ .Values.a2a.saToken.mountPath }}
        {{- else if .Values.a2a.tokenPath }}
        - --a2a-token-path={{ .Values.a2a.tokenPath }}
        {{- end }}
        {{- end }}
        ports:
        - name: http
          containerPort: {{ .Values.server.port }}
          protocol: TCP
        - name: admin
          containerPort: {{ .Values.admin.port }}
          protocol: TCP
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- if and .Values.slack.enabled .Values.slack.secretName }}
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.slack.secretName }}
              key: bot-token
        - name: SLACK_SIGNING_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.slack.secretName }}
              key: signing-secret
        {{- if eq .Values.slack.mode "socketmode" }}
        - name: SLACK_APP_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.slack.secretName }}
              key: app-token
              optional: true
        {{- end }}
        {{- end }}
        {{- if and .Values.slack.enabled .Values.slack.dmMode }}
        - name: KLAUS_GATEWAY_SLACK_DM_MODE
          value: {{ .Values.slack.dmMode | quote }}
        {{- end }}
        {{- if and .Values.slack.enabled .Values.slack.channelMode }}
        - name: KLAUS_GATEWAY_SLACK_CHANNEL_MODE
          value: {{ .Values.slack.channelMode | quote }}
        {{- end }}
        {{- if and .Values.slack.enabled .Values.slack.channelAllowlist }}
        - name: KLAUS_GATEWAY_SLACK_CHANNEL_ALLOWLIST
          value: {{ join "," .Values.slack.channelAllowlist | quote }}
        {{- end }}
        {{- if and .Values.slack.enabled .Values.slack.dropStale }}
        - name: KLAUS_GATEWAY_SLACK_DROP_STALE
          value: "true"
        {{- end }}
        {{- if and .Values.slack.enabled (.Values.slack.progress).mode }}
        - name: KLAUS_GATEWAY_SLACK_PROGRESS_MODE
          value: {{ .Values.slack.progress.mode | quote }}
        {{- end }}
        {{- if and .Values.slack.enabled ((.Values.slack.progress).emojis).working }}
        - name: KLAUS_GATEWAY_SLACK_WORKING_EMOJI
          value: {{ .Values.slack.progress.emojis.working | quote }}
        {{- end }}
        {{- if and .Values.slack.enabled ((.Values.slack.progress).emojis).done }}
        - name: KLAUS_GATEWAY_SLACK_DONE_EMOJI
          value: {{ .Values.slack.progress.emojis.done | quote }}
        {{- end }}
        {{- if and .Values.slack.enabled ((.Values.slack.progress).emojis).failed }}
        - name: KLAUS_GATEWAY_SLACK_FAILED_EMOJI
          value: {{ .Values.slack.progress.emojis.failed | quote }}
        {{- end }}
        {{- if and .Values.slack.enabled (not (kindIs "invalid" (.Values.slack.progress).clearReactionOnDone)) }}
        - name: KLAUS_GATEWAY_SLACK_CLEAR_REACTION_ON_DONE
          value: {{ .Values.slack.progress.clearReactionOnDone | quote }}
        {{- end }}
        - name: KLAUS_GATEWAY_CLI_ENABLED
          value: {{ .Values.cli.enabled | quote }}
        - name: KLAUS_GATEWAY_WEB_ENABLED
          value: {{ .Values.web.enabled | quote }}
        {{- if .Values.obo.enabled }}
        # Slack OBO. client_id is auto-derived from the callback base URL (CIMD),
        # so no client-id value is wired here.
        - name: KLAUS_GATEWAY_OBO_ENABLED
          value: "true"
        - name: KLAUS_GATEWAY_OBO_MUSTER_URL
          value: {{ .Values.obo.musterUrl | quote }}
        - name: KLAUS_GATEWAY_OBO_CALLBACK_BASE_URL
          value: {{ .Values.obo.callbackBaseUrl | quote }}
        - name: KLAUS_GATEWAY_OBO_STATE_KEY_FILE
          value: /etc/klaus-gateway/obo/state-key
        {{- if .Values.obo.storePath }}
        - name: KLAUS_GATEWAY_OBO_STORE_PATH
          value: {{ .Values.obo.storePath | quote }}
        - name: KLAUS_GATEWAY_OBO_STORE_KEY_FILE
          value: /etc/klaus-gateway/obo/store-key
        {{- end }}
        {{- if .Values.obo.connectors.enabled }}
        - name: KLAUS_GATEWAY_OBO_CONNECTORS_ENABLED
          value: "true"
        {{- end }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: admin
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: admin
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          {{- with .Values.securityContext }}
            {{- . | toYaml | nindent 10 }}
          {{- end }}
        {{- if or .Values.a2a.saToken.enabled .Values.obo.enabled }}
        volumeMounts:
        {{- if .Values.a2a.saToken.enabled }}
        - name: kagent-sa-token
          mountPath: {{ dir .Values.a2a.saToken.mountPath }}
          readOnly: true
        {{- end }}
        {{- if .Values.obo.enabled }}
        - name: obo-keys
          mountPath: /etc/klaus-gateway/obo
          readOnly: true
        {{- if .Values.obo.storePath }}
        - name: obo-store
          mountPath: {{ dir .Values.obo.storePath }}
        {{- end }}
        {{- end }}
        {{- end }}
      {{- if or .Values.a2a.saToken.enabled .Values.obo.enabled }}
      volumes:
      {{- if .Values.a2a.saToken.enabled }}
      - name: kagent-sa-token
        projected:
          sources:
          - serviceAccountToken:
              path: {{ base .Values.a2a.saToken.mountPath }}
              audience: {{ .Values.a2a.saToken.audience }}
              expirationSeconds: {{ .Values.a2a.saToken.expirationSeconds }}
      {{- end }}
      {{- if .Values.obo.enabled }}
      - name: obo-keys
        secret:
          secretName: {{ include "resource.default.name" . }}-obo
      {{- if .Values.obo.storePath }}
      - name: obo-store
        {{- if .Values.obo.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ .Values.obo.persistence.existingClaim | default (printf "%s-obo-store" (include "resource.default.name" .)) }}
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- end }}
      {{- end }}
      {{- end }}
      terminationGracePeriodSeconds: 10
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
