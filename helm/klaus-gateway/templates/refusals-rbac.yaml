{{- if .Values.refusals.enabled }}
{{- $egressNamespace := (split "/" .Values.refusals.egressService)._0 }}
# The egress refusal notices read an Agent's creator from the Agent, in any
# namespace an agent runs in; the ClusterRole is named per release namespace
# so two releases do not collide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "resource.default.name" . }}-{{ include "resource.default.namespace" . }}-refusals
  labels:
    {{- include "labels.common" . | nindent 4 }}
rules:
- apiGroups: ["api.kagent.dev"]
  resources: ["agents"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "resource.default.name" . }}-{{ include "resource.default.namespace" . }}-refusals
  labels:
    {{- include "labels.common" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "resource.default.name" . }}-{{ include "resource.default.namespace" . }}-refusals
subjects:
- kind: ServiceAccount
  name: {{ include "resource.default.name" . }}
  namespace: {{ include "resource.default.namespace" . }}
---
# The egress pods are found through their Service's EndpointSlices, in the
# egress's own namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "resource.default.name" . }}-{{ include "resource.default.namespace" . }}-refusals
  namespace: {{ $egressNamespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
rules:
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "resource.default.name" . }}-{{ include "resource.default.namespace" . }}-refusals
  namespace: {{ $egressNamespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "resource.default.name" . }}-{{ include "resource.default.namespace" . }}-refusals
subjects:
- kind: ServiceAccount
  name: {{ include "resource.default.name" . }}
  namespace: {{ include "resource.default.namespace" . }}
{{- end }}
