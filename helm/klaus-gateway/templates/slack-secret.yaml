{{- if and .Values.slack.enabled .Values.slack.secretName .Values.slack.botToken }}
# Rendered only when Slack credentials are supplied as values (e.g. SOPS-encrypted
# via the agentic-platform umbrella's secret-values patch). When slack.botToken is
# empty the chart assumes slack.secretName references an externally-managed Secret.
# Keys match what templates/deployment.yaml reads: bot-token / signing-secret / app-token.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.slack.secretName }}
  namespace: {{ include "resource.default.namespace" . }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
type: Opaque
stringData:
  bot-token: {{ .Values.slack.botToken | quote }}
  {{- with .Values.slack.signingSecret }}
  signing-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.slack.appToken }}
  app-token: {{ . | quote }}
  {{- end }}
{{- end }}
