{{- if .Values.obo.enabled }}
{{- if and (not .Values.obo.existingSecret) (not .Values.obo.stateKey) }}
{{- fail "obo.enabled is true but neither obo.existingSecret nor obo.stateKey is set: the gateway needs the HMAC state key (Secret key state-key, plus store-key when obo.storePath is set)" }}
{{- end }}
{{- if not .Values.obo.existingSecret }}
# Rendered only when the OBO keys are supplied as values. With obo.existingSecret
# set the pre-created Secret of that name is mounted instead and nothing is
# rendered here. Keys match what templates/deployment.yaml mounts:
# state-key / store-key.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "resource.default.name" . }}-obo
  namespace: {{ include "resource.default.namespace" . }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.obo.stateKey }}
  state-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.obo.storeKey }}
  store-key: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}
