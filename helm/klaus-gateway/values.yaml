# Default values for klaus-gateway.

# Umbrella-chart keys. The agent-platform app-of-apps forwards its klausGateway
# values block verbatim to this chart, including its own control keys below.
# The chart ignores them; they exist so the values schema accepts the block.
enabled: true
agentgatewayRoute: {}  # @schema additionalProperties: true

name: klaus-gateway
serviceType: managed

# Override the resource name for all Kubernetes objects. Useful when deploying
# as a subchart where .Release.Name is the parent chart name (e.g. agentic-platform).
fullnameOverride: ""

image:
  registry: gsoci.azurecr.io
  name: giantswarm/klaus-gateway
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# Log level: debug, info, warn, error.
logLevel: info

pod:
  user:
    id: 65532
  group:
    id: 65532

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

serviceAccount:
  create: true
  annotations: {}

# Public HTTP server (channel adapters + /v1/* front door).
server:
  port: 8080

# Admin endpoints: /healthz, /readyz, /metrics.
admin:
  port: 8081

metrics:
  enabled: true

serviceMonitor:
  enabled: true
  interval: "60s"
  scrapeTimeout: "45s"

# Routing table: the binding of every thread to its agent instance and, while a
# turn runs, the record of the task in flight (delivered after a restart). The
# store decides whether either outlives the pod.
#
#   memory    -- the default. Nothing outlives the pod: after a restart every
#                thread starts a fresh conversation and a turn cut by the
#                restart is lost. For development and single-pod trials.
#   valkey    -- for installations. One key per thread in a Valkey (or Redis
#                compatible) server, no volume, no API-server access, shared
#                by replicas. The agent platform runs one for muster's token
#                store; point routing.valkey at it (see below).
#   bolt      -- a file at boltPath. Durable only when boltPath lies inside a
#                mounted volume; the chart mounts none, so with the defaults it
#                lives on the container filesystem and a pod recreation loses
#                it (the gateway still treats it as durable and promises
#                delivery after a restart). Development only.
routing:
  store: memory  # @schema enum: [memory, valkey, bolt]
  boltPath: /var/lib/klaus-gateway/routes.bolt
  # Default TTL for route entries (e.g. "24h"). Zero means never expire.
  defaultTTL: "24h"
  # Sliding lifetime of a channel thread's state: its agent, initiator, grants
  # and AgentInstance binding, refreshed on every handled message. After this
  # long without a message the thread is forgotten and the next mention starts
  # a fresh conversation. "0" never expires (the keys are then never evictable
  # in a Valkey that runs as a cache).
  threadTTL: "2160h"
  # Create instances on demand when a route key has no entry.
  autoCreate: false
  # The Valkey server of store: valkey.
  valkey:
    # url is the server as host:port, e.g. muster-valkey:6379 for the agent
    # platform's Valkey in the same namespace. Required with store: valkey.
    url: ""
    # username is the ACL user; empty means the server's default user.
    username: ""
    # existingSecret names a Secret in the release namespace holding the
    # password under passwordKey; the chart passes it to the pod as
    # KLAUS_GATEWAY_VALKEY_PASSWORD. Empty connects without a password.
    existingSecret: ""
    passwordKey: valkey-password
    # db is the logical database to SELECT.
    db: 0
    tls:
      enabled: false
      # serverName overrides the name the server certificate is verified
      # against when it differs from url's host.
      serverName: ""
    # keyPrefix namespaces the routing keys. Empty means klaus-gateway:route:.
    # Set it when two gateways share one server.
    keyPrefix: ""
    # timeout bounds the dial and every command. A Valkey outage fails the
    # turn after this long, with a clear error in the thread, instead of
    # hanging it; readiness fails with it and recovers with the server.
    timeout: "2s"

# Lifecycle driver: klausctl (local), operator (MCP to klaus-operator), or static (no-op when staticInstances is empty).
lifecycle:
  driver: operator
  klausctlBin: ""
  operatorMCPURL: ""
  # Bearer token for the operator MCP endpoint; empty disables auth.
  operatorMCPToken: ""
  # staticInstances is a comma-separated list of name=baseURL pairs used when
  # driver is "static" (e.g. "sre-agent=http://sre-agent.kagent.svc:8080").
  staticInstances: ""

# Upstream wiring for the OpenAI-compat direct proxy path (pkg/api).
# When empty the gateway talks directly to instance BaseURLs.
# When set, outgoing requests are rewritten through the agentgateway data-plane
# and the instance name is passed via the X-Klaus-Instance header.
# Not used for A2A channel traffic; A2A routes through a2a.url instead.
upstream:
  url: ""
  # Deprecated alias for url, still forwarded by the agent-platform umbrella.
  # Ignored by the chart.
  agentgatewayURL: ""

observability:
  # OTLP gRPC collector traces are exported to: a URL whose scheme decides TLS
  # (http://otlp-gateway.kube-system.svc:4317) or a bare host:port (plaintext).
  # Empty exports nothing; spans are still created, so every turn's log records
  # carry a trace id and the A2A calls a traceparent. Each channel turn is one
  # trace: the gateway's `<channel>.turn` span parents the kagent controller's
  # SendStreamingMessage, the Slack API calls and any token refresh.
  otlpEndpoint: ""
  # -- Headers sent with every trace export, e.g. the tenant of a multi-tenant
  # gateway: `X-Scope-OrgID: giantswarm`. Rendered as --otel-otlp-headers.
  otlpHeaders: {}  # @schema additionalProperties: true

# -- Annotations on the pod template (merged over the chart's own). The
# agent platform sets `karpenter.sh/do-not-disrupt: "true"` here so Karpenter's
# consolidation works around the pod that holds the channel connections and the
# in-flight A2A streams instead of evicting it.
podAnnotations: {}  # @schema additionalProperties: true
# -- Labels on the pod template.
podLabels: {}

# -- PodDisruptionBudget on the gateway pods. Off by default: with
# `replicaCount: 1` a `minAvailable: 1` budget refuses every voluntary eviction
# (node drains wait for the drain timeout), which is the intended guard for a
# single replica that carries live Slack/CLI/web turns, but a deliberate choice.
# Set exactly one of `minAvailable` / `maxUnavailable` (int or percentage);
# `unhealthyPodEvictionPolicy: AlwaysAllow` lets a pod that is not Ready be
# evicted regardless, so a crash-looping gateway never wedges a drain.
podDisruptionBudget:
  enabled: false
  minAvailable: 1  # @schema type: [integer, string, null]
  maxUnavailable:  # @schema type: [integer, string, null]
  unhealthyPodEvictionPolicy: ""  # @schema enum: ["", IfHealthyBudget, AlwaysAllow]

# -- Seconds the kubelet gives the pod to stop before it is killed. The
# shutdown drains the HTTP servers (up to 15 s), then stops the channel
# adapters (up to 15 s more), which is when a Slack turn cut short posts its
# restart notice and clears its progress reaction; the rest is margin for the
# client and store closes. Lower than the drain plus the stop and a turn
# interrupted by a restart ends in silence.
terminationGracePeriodSeconds: 45

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

# Optional Kubernetes Gateway API + agentgateway CRDs that sit in front of this
# gateway. Rendered only when agentgateway.enabled is true so the chart stays
# installable in clusters without the agentgateway CRDs.
#
# Targets upstream agentgateway v1.1.0 (agentgateway.dev/v1alpha1).
agentgateway:
  enabled: false
  # gatewayClassName of the Gateway API controller that reconciles the Gateway.
  gatewayClassName: agentgateway

  # Gateway rendering. When create is false, the chart does not render a
  # Gateway and the HTTPRoute attaches to the externally-managed Gateway
  # referenced by parentRefs.
  gateway:
    create: true
    parentRefs: []
    # Listener definitions applied when create is true.
    listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    annotations: {}

  routes:
    # Primary route: /v1/* and /mcp traffic enters klaus-gateway, which then
    # dispatches to the right klaus instance.
    chatAndMcp:
      enabled: true
      prefixes:
      - /v1/
      - /mcp
    # CLI channel adapter route: /cli/v1/* for remote klausctl users.
    cli:
      enabled: false
      prefixes:
      - /cli/v1/
    # Slack OBO linking + CIMD document: /auth/slack/link, /auth/slack/callback
    # and /auth/slack/client.json. muster and the linking browser must both be
    # able to reach these on the gateway's public hostname. Enable with obo.
    obo:
      enabled: false
      prefixes:
      - /auth/slack/
    # Direct-to-instance IDE traffic. Normally populated by klaus-operator at
    # runtime, so off by default in the chart.
    directInstance:
      enabled: false

  # AgentgatewayPolicy attached to the Gateway.
  # Upstream v1.1.0 supports JWT but not Cedar. Cedar will be wired in when it
  # lands upstream; see docs/deployment.md.
  policy:
    enabled: false
    # JWT validation via spec.traffic.jwtAuthentication.
    jwt:
      enabled: false
      mode: Strict
      issuer: ""
      audiences: []
      jwks:
        # "inline" (literal JWKS JSON) or "remote" (jwksPath + backendRef).
        mode: remote
        inline: ""
        remote:
          jwksPath: /.well-known/jwks.json
          cacheDuration: 5m
          backendRef:
            group: ""
            kind: Service
            name: ""
            namespace: ""
            port: 443

  # Example AgentgatewayBackend pointing at a single klaus instance Service.
  # Real cluster usage creates one Backend per instance, owned by
  # klaus-operator.
  backendsExample:
    enabled: false
    name: klaus-instance-example
    static:
      host: klaus-instance-example.default.svc.cluster.local
      port: 8080

# kagent client surface. When enabled, the gateway runs channel turns on a
# kagent API v2 controller: the AgentTemplate roster is discovered over
# kagent's gRPC services, every thread is bound to one AgentInstance, and the
# turns travel as A2A v1 over gRPC. No A2A server is started on the gateway.
#
# Every call to the controller is made as the person behind the turn: their
# Dex id_token (the Slack account link, or the bearer a web/cli caller sends)
# is the only credential presented. The gateway never speaks to the controller
# as its own ServiceAccount, so the route's JWT policy needs no second issuer.
a2a:
  enabled: false
  # defaultAgent is the AgentTemplate a turn runs on when the channel names
  # none: a bare name in a2a.namespace, or "namespace/name".
  defaultAgent: "sre-agent"
  # url is the controller's gRPC target, reached through agentgateway
  # (required when a2a.enabled is true). Two shapes:
  #   grpc://host:port  -- plaintext h2c, the in-cluster agentgateway Service
  #   grpcs://host:port -- TLS, the public kagent hostname
  # Examples:
  #   grpc://agentgateway.agent-platform.svc.cluster.local:8080
  #   grpcs://agentgateway.<domain>:443   (the controller route's public hostname; a lab: grpcs://agentgateway.127.0.0.1.nip.io:8445)
  url: ""
  # namespace is the namespace whose AgentTemplates are served; defaultAgent
  # and bare agent names resolve in it.
  namespace: "kagent"
  # caSecret names a Secret (key ca.crt) with a CA bundle trusted for a
  # grpcs:// url in addition to the system roots, e.g. a private PKI's root.
  # Empty trusts the system roots only.
  caSecret: ""
  # caFile is a path inside the container to a CA bundle for a grpcs:// url,
  # for images or mounts that already carry one. caSecret takes precedence.
  caFile: ""
  # tokenPath is an optional path to a file holding a Bearer token for the
  # Klaus-instance paths. It is never presented to the kagent controller. When
  # saToken.enabled is true this is auto-set.
  tokenPath: ""
  # fallbackIconUrlTemplate is used when an AgentTemplate carries no
  # ui.giantswarm.io/icon-url annotation. "{agent}" is replaced with the
  # agent's technical name. Empty disables the fallback (the channel uses its
  # own default icon).
  # Example: https://avatars.example.com/v1/{agent}.png
  fallbackIconUrlTemplate: ""
  # saToken controls a projected ServiceAccount token mounted on the gateway pod
  # for the Klaus-instance paths. It is not used toward the kagent controller.
  saToken:
    enabled: false
    audience: "kagent"
    mountPath: "/var/run/secrets/kagent/token"
    expirationSeconds: 3600

# Slack channel adapter.
# Disabled by default. To enable, set slack.enabled: true and provide a
# Kubernetes Secret named by slack.secretName containing the following keys:
#   bot-token        -- Slack bot ... bot OAuth token
#   signing-secret   -- signing secret for Events API request verification
#   app-token        -- Slack app-level ... app-level token (socketmode only)
#
# The secret values are injected as SLACK_BOT_TOKEN, SLACK_SIGNING_SECRET,
# and SLACK_APP_TOKEN environment variables respectively.
slack:
  enabled: false
  # mode selects the connection method: "events" (Events API webhook,
  # production) or "socketmode" (Socket Mode WebSocket, development).
  mode: events
  # secretName is the name of the Kubernetes Secret with Slack credentials
  # (keys: bot-token, signing-secret, and app-token for socketmode).
  # Required when slack.enabled is true.
  secretName: ""
  # dmMode selects how direct messages are handled: "serve" (answer them, the
  # default), "redirect" (point the user to channels), or "ignore" (drop
  # silently). Rendered as SLACK_DM_MODE. Empty lets the binary default (serve).
  dmMode: ""
  # channelMode selects which channels are served: "all" (every channel the bot
  # is invited to, the default), "allowlist" (only channelAllowlist), or "none"
  # (DM-only deployments). Rendered as SLACK_CHANNEL_MODE. Empty lets the
  # binary default (all).
  channelMode: ""
  # channelAllowlist lists the Slack channel IDs (C…, from the channel's
  # "About" tab) served when channelMode is "allowlist". Rendered as
  # SLACK_CHANNEL_ALLOWLIST.
  channelAllowlist: []
  # dropStale ignores Slack events older than the gateway's start time, so a
  # restart never replays messages queued while it was down. Rendered as
  # SLACK_DROP_STALE. Default false.
  dropStale: false
  # progress configures how a turn's progress is shown in Slack.
  progress:
    # mode selects the display: "auto" (reactions, falling back to text on
    # missing scope), "reactions", or "text". Rendered as SLACK_PROGRESS_MODE.
    # Empty lets the binary default (auto).
    mode: ""
    # emojis override the reaction emoji names (no colons) for a turn that is
    # working / done / failed. Rendered as SLACK_WORKING_EMOJI, SLACK_DONE_EMOJI,
    # SLACK_FAILED_EMOJI. Empty lets the binary default (eyes / white_check_mark
    # / x).
    emojis:
      working: ""
      done: ""
      failed: ""
    # clearReactionOnDone: on a successful turn, remove the working reaction
    # without adding a done reaction; set false to swap in the done emoji
    # instead. Rendered as SLACK_CLEAR_REACTION_ON_DONE. Leave unset (null) to
    # use the binary default (true); set true or false to override explicitly.
    # @schema type:[boolean, null]
    clearReactionOnDone: null
  # botToken / signingSecret / appToken: when set, the chart renders the
  # secretName Secret from them, which copies the credentials into the release
  # manifest (and, under an umbrella, into its HelmRelease values). Prefer
  # leaving them empty and pre-creating the secretName Secret out of band.
  botToken: ""
  signingSecret: ""
  appToken: ""

# CLI channel adapter.
# Exposes POST /cli/v1/{instance}/run (SSE completions) and
# POST /cli/v1/{instance}/messages (history) for remote klausctl users.
# Disabled by default.
cli:
  enabled: false

# Web channel adapter.
# Exposes POST /web/messages (SSE completions) for browser front-ends (e.g.
# lab's chatproxy). Disabled by default in cluster deployments; the binary
# default is enabled for local development.
web:
  enabled: false

# Slack on-behalf-of (OBO) muster account linking.
# When enabled, the gateway acts as a muster OAuth client: a human links their
# Slack identity once via a browser PKCE flow, after which the gateway mints a
# fresh human muster token per Slack turn (the agent acts as the human, not
# pure M2M). It mounts /auth/slack/link, /auth/slack/callback and the CIMD
# document at /auth/slack/client.json.
#
# Client registration uses CIMD (Client ID Metadata Documents), not Dynamic
# Client Registration: the OAuth client_id is the public URL of the CIMD
# document the gateway self-hosts (callbackBaseUrl + /auth/slack/client.json),
# derived automatically. muster fetches and validates it -- no registration
# token, no server-side allowlist.
obo:
  enabled: false
  # musterUrl is the muster authorization-server base URL (RFC 8414 discovery).
  musterUrl: ""
  # callbackBaseUrl is the gateway's public, externally reachable base URL
  # (e.g. https://agentgateway.example.com). The muster redirect URI and the
  # CIMD client_id are derived from it.
  callbackBaseUrl: ""
  # store selects where the Slack<->muster links live. Records are sealed with
  # store-key (AES-256-GCM) in either backend.
  #   bolt   -- an encrypted file at storePath on the pod's volume (persistence
  #             below). One ReadWriteOnce claim binds the pod to a node: when the
  #             node dies, the replacement waits for the volume (Multi-Attach) and
  #             a second replica is impossible.
  #   secret -- one Kubernetes Secret in the release namespace (storeSecretName;
  #             default <release>-obo-links, created empty by the chart with
  #             helm.sh/resource-policy: keep). No volume, so a replacement pod is
  #             Ready on any node the moment it is scheduled and replicas can
  #             share the links (resourceVersion optimistic concurrency). The
  #             chart grants the ServiceAccount get/update/patch on exactly that
  #             Secret (Role + RoleBinding). Recommended; see UPGRADE.md for the
  #             move off the volume.
  store: bolt  # @schema enum: [bolt, secret]
  # storeSecretName names the link Secret of the secret backend. Empty lets the
  # chart create <release>-obo-links; set it to use a Secret you manage (the
  # chart then renders only the Role and RoleBinding for it).
  storeSecretName: ""
  # storePath is the encrypted bolt link-store path. With store: bolt, empty
  # uses an in-memory store (links lost on restart); when set, persistence
  # (below) decides whether the directory is backed by an emptyDir
  # (pod-ephemeral) or a PVC (durable). With store: secret it is the bolt file
  # to import links from on start: keep it (and persistence) for the first
  # start on the secret backend, then drop persistence to release the volume.
  storePath: ""
  # persistence backs storePath's directory. Disabled -> emptyDir: links survive
  # in-process restarts but not pod reschedules (rollouts, node drains). Enabled
  # -> a ReadWriteOnce PVC so links survive pod recreation. With a single RWO
  # claim mounted the Deployment uses the Recreate strategy (the old pod must
  # release the volume before the new one mounts it), whichever backend reads
  # it; the secret backend without persistence mounts nothing and rolls.
  persistence:
    enabled: false
    size: 64Mi
    accessMode: ReadWriteOnce
    # storageClass: "" uses the cluster default. existingClaim: "" lets the chart
    # create the PVC; set it to reuse a pre-provisioned claim.
    storageClass: ""
    existingClaim: ""
  # existingSecret names a pre-created Secret in the release namespace that
  # holds the OBO keys: `state-key` (the HMAC key signing link state) and, with
  # store: secret or a storePath, `store-key` (the AES-256 link-store key). When set, the
  # chart renders no Secret of its own and mounts this one, so the keys never
  # pass through Helm values or the release manifest; stateKey and storeKey
  # below are ignored. One of existingSecret or stateKey is required when
  # obo.enabled is true (the render fails otherwise).
  existingSecret: ""
  # stateKey is the HMAC key used to sign link state (CSRF + Slack-user binding).
  # Required when obo.enabled is true and existingSecret is empty; the chart then
  # renders it into the <release>-obo Secret and mounts it as a file. Prefer
  # existingSecret: a value set here is copied into the release manifest.
  stateKey: ""
  # storeKey is the AES-256 key for the encrypted link store, required when the
  # store is secret or storePath is set, and existingSecret is empty. Accepts 32 raw bytes or a
  # base64/hex encoding of 32 bytes (a SOPS-staged base64 value works directly).
  storeKey: ""
  # connectors enables the reactive Slack connector UX: the gateway detects a
  # core_auth_login challenge in the agent's response stream and offers a
  # "Connect <backend>" button from the login link the agent relays. The
  # gateway does not call muster.
  connectors:
    enabled: false

global:  # @schema additionalProperties: true
  podSecurityStandards:
    enforced: false

# Scheduling of the gateway pod. Free-form maps: the generated values schema
# takes any node label / any affinity term (without the annotation it refused
# every key — `additional properties 'karpenter.sh/capacity-type' not allowed`).
nodeSelector: {}  # @schema additionalProperties: true

tolerations: []

affinity: {}  # @schema additionalProperties: true
