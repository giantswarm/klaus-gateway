# Slack app manifest for the Klaus Gateway integration.
#
# Import this manifest at https://api.slack.com/apps?new_app=1 (choose
# "From an app manifest") to create and configure the Slack app in one step.
#
# After creation:
#   1. Copy the Signing Secret (Settings > Basic Information) into
#      your secrets file or SLACK_SIGNING_SECRET env var.
#   2. Copy the Bot Token (OAuth & Permissions > Bot User OAuth Token, starts
#      with Slack bot ) into SLACK_BOT_TOKEN.
#   3. For socketmode only: copy the App-Level Token (Settings > Basic
#      Information > App-Level Tokens, starts with Slack app-level ) into SLACK_APP_TOKEN.
#   4. Install the app to your workspace (Settings > Install App).
#
# Events API (production):
#   Set the Request URL to https://<your-domain>/channels/slack/events and
#   click "Save". Slack will send a URL verification challenge; the adapter
#   handles it automatically.
#
# Socket Mode (development):
#   Enable Socket Mode in Settings > Socket Mode. No public URL required.

display_information:
  name: Klaus Gateway
  description: AI assistant powered by Klaus, routed through Klaus Gateway
  background_color: "#1a1a2e"

features:
  bot_user:
    display_name: Klaus
    always_online: true
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  # Message shortcut (⋯ menu → Apps on any message). Delivered as a
  # message_action interaction payload to the interactivity request URL; the
  # gateway replies with an ephemeral rendering of the thread's retained
  # tool-call log. Changing this section requires re-syncing the app config
  # at api.slack.com/apps (manifests are not applied automatically).
  shortcuts:
    - name: Inspect agent steps
      type: message
      callback_id: inspect_agent_steps
      description: Show the tool calls behind the agent's recent turns in this thread (only visible to you)
  # Native slash command: opens the agent picker modal (agent select over the
  # live roster + question box); submitting it posts the conversation root in
  # the channel and runs the question as the thread's first turn. The gateway
  # does not depend on the command's name, so rename it per app if you like;
  # names are workspace-global (avoid /agent: it collides with Slack's built-in
  # /agents). Slack hides developer slash commands in threads and in the agent
  # pane, so this only opens channel conversations. Set the url to your public
  # hostname, like the request URLs below.
  slash_commands:
    - command: /swarmgeist
      description: Start a conversation with an agent
      usage_hint: "[question]"
      url: https://example.com/channels/slack/commands
      should_escape: false
  # Agent view (assistant surface). Required for the app_home_opened /
  # app_context_changed lifecycle events. Note: per Slack, adopting agent_view
  # is one-way (no downgrade to the legacy assistant_view).
  agent_view:
    agent_description: AI assistant powered by Klaus, routed through Klaus Gateway
    # Pinned at the top of the assistant Messages tab; clicking one sends its
    # message as a normal DM turn.
    suggested_prompts:
      - title: Check cluster health
        message: How are my clusters doing right now?
      - title: Investigate an alert
        message: Help me investigate a firing alert.
      - title: See what I can do
        message: /help

oauth_config:
  scopes:
    bot:
      # Send messages and update existing messages (streaming responses).
      - chat:write
      # Post agent replies under the agent's own name/icon (per-message branding).
      - chat:write.customize
      # Add/remove progress reactions on the triggering message.
      - reactions:write
      # Read DMs sent to the bot.
      - im:history
      # React to messages in channels the bot is a member of.
      - channels:history
      # Download message attachments (url_private) so they can be forwarded to
      # the agent. Without this the token is unauthorized and Slack serves an
      # HTML sign-in page instead of the file bytes.
      - files:read
      # Join public channels on invite (app_mention works without this, but
      # history lookup requires membership).
      - channels:join
      # Assistant surface (agent_view); Slack adds this scope with the feature.
      - assistant:write
      # Slash commands and shortcuts. Already granted on installs that carry the
      # message shortcut (Slack adds it with the feature); listed so a fresh
      # install gets it.
      - commands

settings:
  event_subscriptions:
    # Events API request URL. Replace with your public hostname.
    request_url: https://example.com/channels/slack/events
    bot_events:
      # Fires when a user @-mentions the bot in any channel.
      - app_mention
      # Fires for direct messages sent to the bot.
      - message.im
      # Fires for messages in public channels where the bot is a member.
      # Used to route thread replies to active bot threads without @-mention.
      - message.channels
      # Fires when a member (including the bot itself) joins a channel.
      # Used to post the bot's introduction when it is added to a channel.
      - member_joined_channel
      # Assistant-surface lifecycle (Agent view). Slack's current Agent view
      # no longer sends assistant_thread_started; these two replace it.
      # app_home_opened (tab "messages") drives the greeting;
      # app_context_changed reports the user's active context.
      - app_home_opened
      - app_context_changed
  interactivity:
    is_enabled: true
    # Interactions request URL (Block Kit clicks, the message shortcut, the
    # agent picker's view_submission). Replace with your public hostname.
    request_url: https://example.com/channels/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false

# Message metadata schema. The gateway stamps the root of every conversation
# it opens itself (the slash command's picker) with this event type, carrying
# the agent and the initiator, and reads it back to restore the thread's
# binding after a restart. Slack drops metadata whose event type is not
# declared here (https://docs.slack.dev/messaging/message-metadata/; the
# manifest key is documented at https://docs.slack.dev/reference/app-manifest).
# The event name must match conversationMetadataEventType in pkg/channels/slack.
metadata_events:
  klaus_gateway.agent_conversation:
    title: Agent conversation
    description: Root of a conversation the gateway opened; carries the agent and the initiator.
    type: object
    properties:
      agent_ref:
        type: string
      initiator_user_id:
        type: string
      entry_point:
        type: string
    required:
      - agent_ref
      - initiator_user_id
