# The kagent API v2 service protos klaus-gateway generates client stubs from.
# The files under kagent/ are verbatim copies from giantswarm/kagent-upstream
# at the commit recorded in ../../pkg/kagent/gen/README.md; `make generate-kagent`
# refreshes both.
version: v2
modules:
  - path: .
deps:
  - buf.build/bufbuild/protovalidate
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
