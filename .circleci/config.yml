version: 2.1

orbs:
  architect: giantswarm/architect@9.1.0

workflows:
  test:
    jobs:
      - architect/go-build:
          context: architect
          name: go-build
          binary: klaus-gateway
          filters:
            tags:
              only: /^v.*/

      # Branch builds: amd64 only for faster PR feedback.
      - architect/push-to-registries:
          context: architect
          multiarch: true
          name: push-to-registries
          platforms: "linux/amd64"
          requires:
            - go-build
          filters:
            branches:
              ignore:
                - main
                - master

      # Main builds: full multi-arch (amd64 + arm64) so the :latest tag
      # works on every spidertron node, including the arm64 GPU sparks.
      - architect/push-to-registries:
          context: architect
          multiarch: true
          name: push-to-registries-latest
          tag-latest-branch: main
          requires:
            - go-build
          filters:
            branches:
              only: main

      # Tag builds: push multi-arch image to gsoci + gsociprivate. Aliyun is
      # handled by the sync-china-registry job below (orb's split-china-push
      # mechanism), so the buildx push no longer crosses the Pacific.
      - architect/push-to-registries:
          context: architect
          multiarch: true
          name: push-to-registries-release
          split-china-push: true
          requires:
            - go-build
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/

      # Mirror gsoci -> Aliyun via the in-China giantswarm/galaxy-runner.
      # Runs in parallel with the chart catalog push; an Aliyun mirror failure
      # does NOT block the chart publish.
      - architect/sync-china-registry:
          context: architect
          name: sync-china-registry
          requires:
            - push-to-registries-release
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/

      # Use the app-build-suite executor (same as klaus + mcp-prometheus) so
      # the chart's `version`/`appVersion` get rewritten from the git tag at
      # build time, instead of going through architect's strict
      # `helm-chart-template` validator -- which requires
      # `pkg/project/project.go` to literally match the tag and would
      # otherwise fail every tag build.
      - architect/push-to-app-catalog:
          executor: app-build-suite
          context: architect
          name: push-to-app-catalog
          app_catalog: giantswarm-catalog
          app_catalog_test: giantswarm-test-catalog
          chart: klaus-gateway
          requires:
            - push-to-registries
          filters:
            branches:
              ignore:
                - main
                - master

      # Tag: push chart after the gsoci image is up. Intentionally does NOT
      # depend on sync-china-registry so the chart catalog can publish the new
      # version even if the in-China Aliyun mirror is slow or fails.
      - architect/push-to-app-catalog:
          executor: app-build-suite
          context: architect
          name: push-to-app-catalog-release
          app_catalog: giantswarm-catalog
          app_catalog_test: giantswarm-test-catalog
          chart: klaus-gateway
          requires:
            - push-to-registries-release
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
