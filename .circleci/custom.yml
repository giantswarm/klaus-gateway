# Repo-owned additions to the generated .circleci/workflows.yml; the setup
# workflow deep-merges this file into it (maps merge, job lists append).
#
# push-image-dev: publish this PR's image so it can be deployed on an
# installation for a manual test before the merge. The generated build-image
# job only validates the build (push: false); this job pushes the same
# multi-arch image to gsoci and gsociprivate under the branch's dev version
# (`<next version>-dev.<branch>.<commit date>.h<sha>`, the version the chart's
# appVersion also carries). Scoped to one branch on purpose: remove this file,
# or the job, before the PR merges — or ask for branchPublish in the devctl
# gen.ci config of giantswarm/github to make dev pushes permanent for the repo.
version: 2.1

workflows:
  build:
    jobs:
    - architect/push-to-registries:
        context: architect
        name: push-image-dev
        split-china-push: true
        requires:
        - go-build
        filters:
          branches:
            only:
            - klaus/agent/20260916-thread-record
